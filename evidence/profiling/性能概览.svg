<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><style>text{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="1200" fill="#f1f5f9" rx="0"/><text x="44" y="50" font-size="30" fill="#1e293b" font-weight="700">Qwen3-VL-32B · H200 实测性能</text><text x="44" y="80" font-size="15" fill="#64748b" font-weight="400">SGLang 0.5.6.post2 · BF16 · 2026-09-17 · 延迟与吞吐来自无 profiler 测试</text><rect x="35" y="105" width="375" height="230" fill="white" rx="12"/><text x="53" y="137" font-size="18" fill="#1e293b" font-weight="600">单请求 decode · 越低越好</text><text x="53" y="166" font-size="13" fill="#1e293b" font-weight="400">当前 DP Attention</text><rect x="53" y="175" width="160.95501163730407" height="13" fill="#64748b" rx="3"/><text x="298" y="187" font-size="12" fill="#1e293b" font-weight="400">15.1 ms/token</text><text x="53" y="220" font-size="13" fill="#1e293b" font-weight="400">DP Attention + compile</text><rect x="53" y="229" width="147.17194302715546" height="13" fill="#7c3aed" rx="3"/><text x="298" y="241" font-size="12" fill="#1e293b" font-weight="400">13.8 ms/token</text><text x="53" y="274" font-size="13" fill="#1e293b" font-weight="400">普通 TP=2</text><rect x="53" y="283" width="131.29362835980146" height="13" fill="#0284c7" rx="3"/><text x="298" y="295" font-size="12" fill="#1e293b" font-weight="400">12.3 ms/token</text><rect x="425" y="105" width="375" height="230" fill="white" rx="12"/><text x="443" y="137" font-size="18" fill="#1e293b" font-weight="600">约 4K 输入首 token · 越低越好</text><text x="443" y="166" font-size="13" fill="#1e293b" font-weight="400">当前 DP Attention</text><rect x="443" y="175" width="160.55842535570264" height="13" fill="#64748b" rx="3"/><text x="688" y="187" font-size="12" fill="#1e293b" font-weight="400">321.1 ms</text><text x="443" y="220" font-size="13" fill="#1e293b" font-weight="400">DP Attention + compile</text><rect x="443" y="229" width="159.5263434574008" height="13" fill="#7c3aed" rx="3"/><text x="688" y="241" font-size="12" fill="#1e293b" font-weight="400">319.1 ms</text><text x="443" y="274" font-size="13" fill="#1e293b" font-weight="400">普通 TP=2</text><rect x="443" y="283" width="126.19590060785411" height="13" fill="#0284c7" rx="3"/><text x="688" y="295" font-size="12" fill="#1e293b" font-weight="400">252.4 ms</text><rect x="815" y="105" width="375" height="230" fill="white" rx="12"/><text x="833" y="137" font-size="18" fill="#1e293b" font-weight="600">8 并发输出吞吐 · 越高越好</text><text x="833" y="166" font-size="13" fill="#1e293b" font-weight="400">当前 DP Attention</text><rect x="833" y="175" width="175.5944296218313" height="13" fill="#64748b" rx="3"/><text x="1078" y="187" font-size="12" fill="#1e293b" font-weight="400">448.3 token/s</text><text x="833" y="220" font-size="13" fill="#1e293b" font-weight="400">DP Attention + compile</text><rect x="833" y="229" width="193.88008978009998" height="13" fill="#7c3aed" rx="3"/><text x="1078" y="241" font-size="12" fill="#1e293b" font-weight="400">495.0 token/s</text><text x="833" y="274" font-size="13" fill="#1e293b" font-weight="400">普通 TP=2</text><rect x="833" y="283" width="202.1559722749752" height="13" fill="#0284c7" rx="3"/><text x="1078" y="295" font-size="12" fill="#1e293b" font-weight="400">516.1 token/s</text><rect x="35" y="355" width="1135" height="196" fill="white" rx="12"/><text x="55" y="390" font-size="20" fill="#1e293b" font-weight="600">GPU kernel 时间构成：稳定 decode（当前 DP Attention，短文本）</text><text x="55" y="433" font-size="15" fill="#1e293b" font-weight="400">GPU 0</text><rect x="140" y="416" width="659.7139199360906" height="24" fill="#0284c7" rx="0"/><text x="145" y="433" font-size="12" fill="white" font-weight="600">71.7%</text><rect x="799.7139199360906" y="416" width="87.79011228346553" height="24" fill="#ef4444" rx="0"/><text x="804.7139199360906" y="433" font-size="12" fill="white" font-weight="600">9.5%</text><rect x="887.5040322195562" y="416" width="67.81624031532468" height="24" fill="#f59e0b" rx="0"/><rect x="955.3202725348808" y="416" width="36.079162064278584" height="24" fill="#10b981" rx="0"/><rect x="991.3994345991593" y="416" width="35.45128672587726" height="24" fill="#7c3aed" rx="0"/><rect x="1026.8507213250366" y="416" width="13.802558543811854" height="24" fill="#94a3b8" rx="0"/><rect x="1040.6532798688484" y="416" width="12.485161582314177" height="24" fill="#a3e635" rx="0"/><rect x="1053.1384414511626" y="416" width="6.861558548837366" height="24" fill="#e879f9" rx="0"/><text x="55" y="471" font-size="15" fill="#1e293b" font-weight="400">GPU 1</text><rect x="140" y="454" width="684.7811363839029" height="24" fill="#0284c7" rx="0"/><text x="145" y="471" font-size="12" fill="white" font-weight="600">74.4%</text><rect x="824.7811363839029" y="454" width="70.69070320911663" height="24" fill="#f59e0b" rx="0"/><text x="829.7811363839029" y="471" font-size="12" fill="white" font-weight="600">7.7%</text><rect x="895.4718395930195" y="454" width="47.49915323708279" height="24" fill="#ef4444" rx="0"/><rect x="942.9709928301022" y="454" width="44.878555968932844" height="24" fill="#10b981" rx="0"/><rect x="987.849548799035" y="454" width="37.03892869591972" height="24" fill="#7c3aed" rx="0"/><rect x="1024.8884774949547" y="454" width="14.902474396108465" height="24" fill="#94a3b8" rx="0"/><rect x="1039.7909518910633" y="454" width="12.94953978308569" height="24" fill="#a3e635" rx="0"/><rect x="1052.7404916741489" y="454" width="7.259508325851026" height="24" fill="#e879f9" rx="0"/><text x="55" y="523" font-size="14" fill="#475569" font-weight="400">蓝：GEMM　红：通信　黄：索引/拷贝/逐元素　紫：Norm　绿：Attention；kernel 时间占比不等于端到端占比。</text><rect x="35" y="571" width="550" height="198" fill="white" rx="12"/><text x="55" y="605" font-size="20" fill="#1e293b" font-weight="600">图与融合</text><text x="55" y="639" font-size="16" fill="#1e293b" font-weight="400">CUDA Graph 已开启；每步仍约 1,620 个 kernel。</text><text x="55" y="670" font-size="16" fill="#1e293b" font-weight="400">开启 compile 后约 1,425 个，减少约 12%。</text><text x="55" y="701" font-size="16" fill="#1e293b" font-weight="400">prefill 使用 eager；短文本活跃 rank 的</text><text x="55" y="727" font-size="16" fill="#1e293b" font-weight="400">无 GPU 活动区间约占该阶段 46%（带 profiler）。</text><rect x="605" y="571" width="565" height="198" fill="white" rx="12"/><text x="625" y="605" font-size="20" fill="#1e293b" font-weight="600">吞吐与延迟的取舍</text><text x="625" y="639" font-size="19" fill="#0284c7" font-weight="600">普通 TP=2，32 并发：1,403 token/s</text><text x="625" y="670" font-size="16" fill="#1e293b" font-weight="400">对应首 token 中位数约 957 ms。</text><text x="625" y="701" font-size="16" fill="#1e293b" font-weight="400">1024 → 512 方图：首 token 263 → 124 ms。</text><text x="625" y="727" font-size="16" fill="#1e293b" font-weight="400">分辨率调整需评估视觉质量，不能无条件缩图。</text><text x="40" y="795" font-size="13" fill="#64748b" font-weight="400">3 轮固定输出 128 token；短文本约 550 token。完整方法、原始 trace 和限制见性能分析报告。</text><rect x="35" y="830" width="1135" height="325" fill="white" rx="12"/><text x="55" y="874" font-size="22" fill="#1e293b" font-weight="600">优先优化顺序</text><text x="55" y="918" font-size="18" fill="#1e293b" font-weight="400">1. 在目标负载下选择 TP=2；当前 DP Attention 存在等待和 padding 开销。</text><text x="55" y="962" font-size="18" fill="#1e293b" font-weight="400">2. compile 已实测有效；prefill 的 piecewise graph 需要单独验证。</text><text x="55" y="1006" font-size="18" fill="#1e293b" font-weight="400">3. 扩大 batch 提高吞吐，结合首 token 延迟设定并发上限。</text><text x="55" y="1050" font-size="18" fill="#1e293b" font-weight="400">4. 优化图片分辨率、前缀缓存路由，以及 24 MiB 图像特征回传 CPU 的路径。</text><text x="55" y="1094" font-size="18" fill="#1e293b" font-weight="400">5. Q/K Norm + MRoPE + KV 写入融合、FP8 权重作为下一轮实验。</text></svg>